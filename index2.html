<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarizGD — VS Code Web</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- MONACO -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

<!-- XTERM -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>

<style>
:root{
  --bg1:#2a2a2a;
  --bg2:#0f0f0f;
  --panel:#1e1e1e;
  --panel2:#252526;
  --border:#2d2d2d;
  --text:#d4d4d4;
  --muted:#888;
  --accent:#007acc;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Consolas, monospace;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  height:100vh;
  overflow:hidden;
}

.app{display:flex;height:100%}

/* ACTIVITY BAR */
.activity{
  width:48px;
  background:#333;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:10px;
}
.activity i{margin:12px 0;opacity:.6}
.activity i.active{opacity:1;color:var(--accent)}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:var(--panel2);
  border-right:1px solid var(--border);
  overflow:auto;
}
.sidebar h3{
  margin:10px;
  font-size:12px;
  color:var(--muted);
}

.tree-item{
  padding:4px 12px;
  cursor:pointer;
  font-size:13px;
}
.tree-item:hover{background:#2a2d2e}
.tree-file.active{background:#094771;color:white}

.folder{font-weight:bold}
.children{margin-left:12px;display:none}
.folder.open + .children{display:block}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* TABS */
.tabs{
  height:34px;
  background:#2d2d2d;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:flex-end;
}
.tab{
  padding:6px 14px;
  font-size:13px;
  background:#2d2d2d;
  margin-right:2px;
  cursor:pointer;
}
.tab.active{background:var(--panel)}
.tab span{margin-left:8px;color:#999}

/* EDITOR + TERMINAL */
.editor-wrap{flex:1;position:relative}
#editor{height:100%}

.terminal{
  height:180px;
  background:#000;
  border-top:1px solid var(--border);
}

/* STATUS */
.status{
  height:22px;
  background:#007acc;
  color:white;
  font-size:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 10px;
}
</style>
</head>

<body>

<div class="app">

  <!-- ACTIVITY BAR -->
  <div class="activity">
    <i class="active">📁</i>
    <i>🔍</i>
    <i>🐞</i>
    <i>🧩</i>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>EXPLORER</h3>
    <div id="tree"></div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="tabs" id="tabs"></div>

    <div class="editor-wrap">
      <div id="editor"></div>
    </div>

    <div class="terminal" id="terminal"></div>

    <div class="status">
      <span>UTF-8</span>
      <span id="lang">Markdown</span>
      <span>Ln 1, Col 1</span>
    </div>
  </div>

</div>

<script>
/* ===== FILE TREE (EDIT HERE) ===== */
const FILE_TREE = {
  src:{
    type:"folder",
    children:{
      "about_me.md":{
        type:"file",
        language:"markdown",
        content:"# FarizGD\n\nGeometry Dash player\nRandom tech enjoyer"
      },
      "farizgd.js":{
        type:"file",
        language:"javascript",
        content:"console.log('Hello VS Code Web');"
      }
    }
  },
  "skills.json":{
    type:"file",
    language:"json",
    content:'{"languages":["Node.js","Python","VB.NET"]}'
  },
  "contact.sh":{
    type:"file",
    language:"shell",
    content:"echo Hello World"
  }
};
/* ===== END ===== */

let editor, terminal;
let openTabs = {};
let currentFile = null;

require.config({ paths:{vs:"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs"} });

require(["vs/editor/editor.main"],()=>{
  editor = monaco.editor.create(document.getElementById("editor"),{
    theme:"vs-dark",
    automaticLayout:true,
    fontSize:14
  });

  editor.onDidChangeModelContent(()=>{
    if(currentFile){
      localStorage.setItem("file:"+currentFile.path, editor.getValue());
    }
  });

  buildTree(FILE_TREE, document.getElementById("tree"), "");
});

/* TERMINAL */
terminal = new Terminal({theme:{background:"#000"}});
terminal.open(document.getElementById("terminal"));
terminal.writeln("FarizGD VS Code Web");
terminal.writeln("type `help`");

terminal.onData(d=>{
  if(d.trim()==="help"){
    terminal.writeln("\ncommands:\n help\n clear\n echo");
  }
  if(d.trim()==="clear"){
    terminal.clear();
  }
});

/* TREE */
function buildTree(obj, parent, path){
  for(const name in obj){
    const item = obj[name];
    if(item.type==="folder"){
      const f=document.createElement("div");
      f.className="tree-item folder";
      f.textContent="📁 "+name;
      parent.appendChild(f);

      const c=document.createElement("div");
      c.className="children";
      parent.appendChild(c);

      f.onclick=()=>f.classList.toggle("open");
      buildTree(item.children, c, path+"/"+name);
    }else{
      const f=document.createElement("div");
      f.className="tree-item tree-file";
      f.textContent="📄 "+name;
      f.onclick=()=>openFile(name, item, path+"/"+name);
      parent.appendChild(f);
    }
  }
}

/* OPEN FILE */
function openFile(name, file, path){
  if(!openTabs[path]){
    openTabs[path]=file;
    const t=document.createElement("div");
    t.className="tab";
    t.textContent=name;
    t.onclick=()=>loadFile(path,file);
    document.getElementById("tabs").appendChild(t);
    t.dataset.path=path;
  }
  loadFile(path,file);
}

function loadFile(path,file){
  currentFile={path,file};
  const saved=localStorage.getItem("file:"+path);
  editor.setModel(monaco.editor.createModel(
    saved ?? file.content,
    file.language
  ));
  document.getElementById("lang").textContent=file.language.toUpperCase();

  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("active",t.dataset.path===path);
  });
}
</script>

</body>
</html>
