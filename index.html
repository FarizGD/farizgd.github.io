<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VS Code Web</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<style>
:root{--bg:#1e1e1e;--sidebar:#252526;--panel:#2d2d2d;--border:#2d2d2d;--text:#d4d4d4;--muted:#888;--active:#094771;--accent:#007acc}
*{box-sizing:border-box}
body{margin:0;font-family:Consolas,monospace;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.app{display:flex;height:100%}
.activity{width:48px;background:#333;display:flex;flex-direction:column;align-items:center;padding-top:10px}
.activity div{margin:12px 0;opacity:.6;font-size:18px}
.activity .active{opacity:1;color:var(--accent)}
.sidebar{width:260px;background:var(--sidebar);border-right:1px solid var(--border);overflow:auto;position:absolute;height:100%;z-index:5;transition:.25s}
.sidebar.hidden{transform:translateX(-260px)}
.sidebar h3{margin:10px;font-size:12px;color:var(--muted)}
.tree-item{padding:6px 14px;cursor:pointer}
.tree-file.active{background:var(--active);color:white}
.folder{font-weight:bold}
.children{margin-left:12px;display:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:36px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center}
.menu-btn{width:40px;text-align:center;font-size:18px;cursor:pointer}
.filebar{display:flex;gap:6px;padding:0 6px;overflow-x:auto}
.filebar button{background:#3c3c3c;border:1px solid #2d2d2d;color:#d4d4d4;font-size:12px;padding:4px 10px}
.tabs{flex:1;display:flex;overflow-x:auto}
.tab{padding:6px 14px;font-size:13px;background:var(--panel);margin-right:2px;cursor:pointer}
.tab.active{background:var(--bg)}
.editor-area{flex:1;display:flex;min-height:0}
.editor-wrap{flex:1 1 60%;min-width:0}
#editor{height:100%}
.divider{width:4px;cursor:col-resize;background:var(--border)}
.preview{flex:1 1 40%;min-width:0;background:white}
.preview iframe{width:100%;height:100%;border:none}
.terminal{height:150px;background:#000;border-top:1px solid var(--border)}
.status{height:22px;background:var(--accent);color:white;font-size:12px;display:flex;justify-content:space-between;align-items:center;padding:0 10px}
@media(max-width:900px){
.editor-area{flex-direction:column}
.preview,.divider{display:none}
}
</style>
</head>

<body>
<div class="app">

<div class="activity">
<div class="active">▣</div>
<div>⌕</div>
<div>⚙</div>
</div>

<div class="sidebar hidden" id="sidebar">
<h3>EXPLORER</h3>
<div id="tree"></div>
</div>

<div class="main">
<div class="topbar">
<div class="menu-btn" id="menu">☰</div>
<div class="filebar">
<button id="upload">Upload</button>
<button id="download">Download</button>
<button id="saveWS">Save WS</button>
<button id="loadWS">Load WS</button>
<button id="resetWS">Reset</button>
</div>
<div class="tabs" id="tabs"></div>
</div>

<div class="editor-area">
<div class="editor-wrap"><div id="editor"></div></div>
<div class="divider" id="divider"></div>
<div class="preview"><iframe id="iframe"></iframe></div>
</div>

<div class="terminal" id="terminal"></div>
<div class="status"><span>UTF-8</span><span id="lang">READY</span><span>OK</span></div>
</div>
</div>

<input type="file" id="fileInput" hidden>

<script>
const FILE_TREE={"index.html":{type:"file",language:"html",content:"<!DOCTYPE html><html><body><h1>Hello</h1></body></html>"}}
let editor,currentPath="",currentFile=null
const models={},tree=document.getElementById("tree"),tabs=document.getElementById("tabs"),iframe=document.getElementById("iframe")

document.getElementById("menu").onclick=()=>document.getElementById("sidebar").classList.toggle("hidden")

require.config({paths:{vs:"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs"}})
require(["vs/editor/editor.main"],()=>{
editor=monaco.editor.create(document.getElementById("editor"),{theme:"vs-dark",automaticLayout:true})
buildTree(FILE_TREE,"")
})

function buildTree(obj,path){
tree.innerHTML=""
for(const name in obj){
const el=document.createElement("div")
el.className="tree-item tree-file"
el.textContent="▪ "+name
el.onclick=()=>openFile(name,obj[name],"/"+name,el)
tree.appendChild(el)
}
}

function openFile(name,file,path,el){
currentPath=path
currentFile=file
if(!models[path]){
const saved=localStorage.getItem("file:"+path)
models[path]=monaco.editor.createModel(saved??file.content,file.language)
models[path].onDidChangeContent(()=>{localStorage.setItem("file:"+path,models[path].getValue());if(file.language==="html")iframe.srcdoc=models[path].getValue()})
}
editor.setModel(models[path])
document.querySelectorAll(".tree-file").forEach(x=>x.classList.remove("active"))
el.classList.add("active")
document.getElementById("lang").textContent=file.language.toUpperCase()
iframe.srcdoc=models[path].getValue()
}

document.getElementById("upload").onclick=()=>document.getElementById("fileInput").click()
document.getElementById("fileInput").onchange=e=>{
const f=e.target.files[0]
if(!f)return
const r=new FileReader()
r.onload=()=>{
const ext=f.name.split(".").pop()
const lang={html:"html",js:"javascript",json:"json",css:"css"}[ext]||"plaintext"
FILE_TREE[f.name]={type:"file",language:lang,content:r.result}
buildTree(FILE_TREE,"")
}
r.readAsText(f)
}

document.getElementById("download").onclick=()=>{
if(!currentPath)return
const blob=new Blob([models[currentPath].getValue()])
const a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download=currentPath.slice(1)
a.click()
}

document.getElementById("saveWS").onclick=()=>{
try{
const dump={}
for(const k in models)dump[k]=models[k].getValue()
localStorage.setItem("workspace",JSON.stringify(dump))
}catch{localStorage.clear()}
}

document.getElementById("loadWS").onclick=()=>{
try{
const data=JSON.parse(localStorage.getItem("workspace"))
for(const k in data)if(models[k])models[k].setValue(data[k])
}catch{localStorage.clear();location.reload()}
}

document.getElementById("resetWS").onclick=()=>{localStorage.clear();location.reload()}

const term=new Terminal({cursorBlink:true})
term.open(document.getElementById("terminal"))
term.write("> ready\r\n")
</script>
</body>
</html>
