<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VS Code Web</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>

<style>
:root{
--editor-bg:#1e1e1e;
--sidebar-bg:#252526;
--panel-bg:#2d2d2d;
--border:#2d2d2d;
--text:#d4d4d4;
--muted:#858585;
--active:#094771;
--accent:#007acc;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:Consolas,monospace;
background:var(--editor-bg);
color:var(--text);
height:100vh;
overflow:hidden;
}
.app{display:flex;height:100%}
.activity{
width:48px;
background:#333;
display:flex;
flex-direction:column;
align-items:center;
padding-top:10px;
}
.activity div{
margin:12px 0;
opacity:.6;
font-size:18px;
}
.activity .active{opacity:1;color:var(--accent)}
.sidebar{
width:260px;
background:var(--sidebar-bg);
border-right:1px solid var(--border);
overflow:auto;
transition:transform .25s ease;
}
.sidebar.hidden{transform:translateX(-260px)}
.sidebar h3{
margin:10px;
font-size:12px;
color:var(--muted);
}
.tree-item{
padding:6px 14px;
font-size:14px;
cursor:pointer;
user-select:none;
}
.tree-item:active{background:#2a2d2e}
.tree-file.active{
background:var(--active);
color:white;
}
.folder{font-weight:bold}
.children{margin-left:12px;display:none}
.main{
flex:1;
display:flex;
flex-direction:column;
min-width:0;
}
.topbar{
height:34px;
background:var(--panel-bg);
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
}
.menu-btn{
width:40px;
text-align:center;
cursor:pointer;
font-size:18px;
}
.tabs{
flex:1;
display:flex;
overflow-x:auto;
}
.tab{
padding:6px 14px;
font-size:13px;
background:var(--panel-bg);
margin-right:2px;
white-space:nowrap;
}
.tab.active{background:var(--editor-bg)}
.actions{
display:flex;
gap:6px;
padding-right:6px;
}
.actions button{
background:#3c3c3c;
border:none;
color:white;
font-size:11px;
padding:4px 8px;
}
.editor-wrap{flex:1;min-height:0}
#editor{height:100%}
.terminal{
height:160px;
background:#000;
border-top:1px solid var(--border);
}
.status{
height:22px;
background:var(--accent);
color:white;
font-size:12px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
}
@media(max-width:900px){
.sidebar{position:absolute;z-index:5;height:100%}
}
</style>
</head>

<body>

<div class="app">

<div class="activity">
<div class="active">▣</div>
<div>⌕</div>
<div>⚙</div>
</div>

<div class="sidebar hidden" id="sidebar">
<h3>EXPLORER</h3>
<div id="tree"></div>
</div>

<div class="main">
<div class="topbar">
<div class="menu-btn" id="menu">☰</div>
<div class="tabs" id="tabs"></div>
<div class="actions">
<button id="save">SAVE</button>
<button id="load">LOAD</button>
<button id="reset">RESET</button>
</div>
</div>

<div class="editor-wrap">
<div id="editor"></div>
</div>

<div class="terminal" id="terminal"></div>

<div class="status">
<span>UTF-8</span>
<span id="lang">PLAINTEXT</span>
<span>READY</span>
</div>
</div>

</div>

<script>
const FILE_TREE={
src:{
type:"folder",
children:{
"about_me.md":{
type:"file",
language:"markdown",
content:"# FarizGD\n\nGeometry Dash player\nRandom tech enjoyer"
},
"farizgd.js":{
type:"file",
language:"javascript",
content:"console.log('Hello VS Code Web');"
}
}
},
"skills.json":{
type:"file",
language:"json",
content:'{ "languages": ["Node.js","Python","VB.NET"] }'
},
"contact.sh":{
type:"file",
language:"shell",
content:"echo Hello World"
}
}

let editor
const models={}
const tabs=document.getElementById("tabs")
const lang=document.getElementById("lang")
const sidebar=document.getElementById("sidebar")

document.getElementById("menu").onclick=()=>{
sidebar.classList.toggle("hidden")
}

require.config({
paths:{vs:"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs"}
})

require(["vs/editor/editor.main"],()=>{
editor=monaco.editor.create(document.getElementById("editor"),{
theme:"vs-dark",
automaticLayout:true,
fontSize:14
})
buildTree(FILE_TREE,document.getElementById("tree"),"")
})

function getModel(path,file){
if(!models[path]){
const saved=localStorage.getItem("file:"+path)
models[path]=monaco.editor.createModel(saved??file.content,file.language)
models[path].onDidChangeContent(()=>{
localStorage.setItem("file:"+path,models[path].getValue())
})
}
return models[path]
}

function buildTree(obj,parent,path){
for(const name in obj){
const item=obj[name]
const full=path+"/"+name
if(item.type==="folder"){
const f=document.createElement("div")
f.className="tree-item folder"
f.textContent="▸ "+name
const c=document.createElement("div")
c.className="children"
f.onclick=()=>{
const open=c.style.display==="block"
c.style.display=open?"none":"block"
f.textContent=(open?"▸ ":"▾ ")+name
}
parent.appendChild(f)
parent.appendChild(c)
buildTree(item.children,c,full)
}else{
const f=document.createElement("div")
f.className="tree-item tree-file"
f.textContent="▪ "+name
f.onclick=()=>{
openFile(name,item,full,f)
sidebar.classList.add("hidden")
}
parent.appendChild(f)
}
}
}

function openFile(name,file,path,el){
const model=getModel(path,file)
editor.setModel(model)
lang.textContent=file.language.toUpperCase()
document.querySelectorAll(".tree-file").forEach(x=>x.classList.remove("active"))
el.classList.add("active")
let tab=document.querySelector(`[data-tab="${path}"]`)
if(!tab){
tab=document.createElement("div")
tab.className="tab"
tab.textContent=name
tab.dataset.tab=path
tab.onclick=()=>editor.setModel(models[path])
tabs.appendChild(tab)
}
document.querySelectorAll(".tab").forEach(t=>{
t.classList.toggle("active",t.dataset.tab===path)
})
}

document.getElementById("save").onclick=()=>{
const dump={}
for(const k in models) dump[k]=models[k].getValue()
localStorage.setItem("workspace",JSON.stringify(dump))
}

document.getElementById("load").onclick=()=>{
const data=JSON.parse(localStorage.getItem("workspace")||"{}")
for(const k in data){
if(models[k]) models[k].setValue(data[k])
}
}

document.getElementById("reset").onclick=()=>{
localStorage.clear()
location.reload()
}

const term=new Terminal({cursorBlink:true,theme:{background:"#000"}})
term.open(document.getElementById("terminal"))
let buffer=""
term.write("> ")
term.onData(e=>{
if(e==="\r"){
term.write("\r\n")
runCmd(buffer)
buffer=""
term.write("> ")
}else if(e==="\u007F"){
if(buffer.length>0){
buffer=buffer.slice(0,-1)
term.write("\b \b")
}
}else{
buffer+=e
term.write(e)
}
})

function runCmd(cmd){
cmd=cmd.trim()
if(cmd==="help"){
term.writeln("help clear echo save load")
}else if(cmd==="clear"){
term.clear()
}else if(cmd==="save"){
document.getElementById("save").click()
term.writeln("workspace saved")
}else if(cmd==="load"){
document.getElementById("load").click()
term.writeln("workspace loaded")
}else if(cmd.startsWith("echo")){
term.writeln(cmd.slice(5))
}else{
term.writeln("command not found")
}
}
</script>

</body>
</html>
